[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfas-interface-dft"
version = "0.1.0"
description = "Source-traceable ASE and Quantum ESPRESSO workflows for PFAS reaction pathways at catalytic interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "shriya_v260"}]
dependencies = ["ase==3.26.0", "numpy>=1.26,<2.5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
geometry = ["rdkit>=2024.9"]

[project.scripts]
pfas = "pfas_dft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
